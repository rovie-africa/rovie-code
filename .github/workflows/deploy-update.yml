name: deploy-update

on:
  push:
    branches:
      - main
      - dev
      - production
  workflow_dispatch:

concurrency:
  group: deploy-update-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: (github.repository == 'rovie-africa/rovie-code' || github.repository == 'anomalyco/opencode' || github.repository_owner == github.actor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Typecheck
        working-directory: services/update
        run: bun run typecheck:tsc

      - name: Provision D1 Database and Migrate
        working-directory: services/update
        run: |
          set -e
          echo "Checking D1 database..."
          DB_INFO=$(bunx wrangler d1 info rovie-code-update --json 2>/dev/null || true)
          DB_ID=$(echo "$DB_INFO" | jq -r '.uuid // empty' 2>/dev/null || true)
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database rovie-code-update..."
            CREATE_INFO=$(bunx wrangler d1 create rovie-code-update --json 2>/dev/null || true)
            DB_ID=$(echo "$CREATE_INFO" | jq -r '.uuid // empty' 2>/dev/null || true)
          fi
          if [ -n "$DB_ID" ]; then
            echo "Resolved D1 Database ID: $DB_ID"
            sed -i "s/\"database_id\": \"[^\"]*\"/\"database_id\": \"$DB_ID\"/" wrangler.jsonc
            echo "Applying migrations..."
            bun run db:migrate || true
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy
        working-directory: services/update
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
