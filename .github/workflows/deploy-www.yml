name: deploy-www

on:
  push:
    branches:
      - main
      - dev
      - production
  workflow_dispatch:

concurrency:
  group: deploy-www-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: (github.repository == 'rovie-africa/rovie-code' || github.repository == 'anomalyco/opencode' || github.repository_owner == github.actor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Build
        working-directory: services/www
        run: bun run build
        env:
          CLOUDFLARE_ENV: ${{ (github.ref_name == 'main' || github.ref_name == 'production') && 'production' || 'dev' }}

      - name: Deploy
        working-directory: services/www
        run: bun run deploy || (echo "=== WRANGLER LOG ===" && cat /home/runner/.config/.wrangler/logs/*.log && exit 1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
